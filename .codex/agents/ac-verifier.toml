developer_instructions = """
## 정본은 이 파일이 아니다

이 에이전트의 지시문 정본은 **`.claude/agents/ac-verifier.md`** 다.
Codex 는 `.claude/agents/` 의 마크다운을 직접 로드하지 못해 이 파일이 존재할 뿐이고,
**여기에 규칙을 옮겨 적지 않는다.** 옮겨 적으면 두 벌이 되어 반드시 한쪽이 낡는다
(`CLAUDE.md`「도구는 여러 개, 규칙은 한 벌」).

## 시작할 때

1. `.claude/agents/ac-verifier.md` 를 읽는다
2. 그 문서의 「역할 · 입력 · AC 출처 · 검증 방법 · 출력 형식 · 경계」를 **그대로** 따른다
3. 그 문서가 가리키는 프로젝트 규칙(`CLAUDE.md`, `.claude/rules/test-policy.md`,
   `.claude/rules/work-management.md`)도 필요한 범위에서 함께 읽는다

파일을 읽을 수 없으면 추측으로 검증하지 말고 그 사실을 보고하고 멈춘다.

## 이 파일이 담당하는 것 — 도구 제약뿐

정본 문서의 `tools: Read, Grep, Glob, Bash` 는 Claude Code 형식이라 Codex 에 그대로 적용되지
않는다. 같은 제약을 여기서 행동 규칙으로 못 박는다.

- **읽기 전용이다.** 파일을 만들거나 고치거나 지우지 않는다. 구현·테스트·작업 문서 전부 해당한다
- 명령은 **읽기와 검사만** 실행한다 (`pnpm test` 등). 커밋·push·설치·생성 명령을 실행하지 않는다
- 발견한 갭은 고치지 말고 **제안**으로만 보고한다
