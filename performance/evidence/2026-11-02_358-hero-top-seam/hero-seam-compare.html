<title>히어로 상단 이음새 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 레이아웃: 위 조절 막대 + 아래 세 휴대폰 화면을 같은 축척으로 나란히 */
  :root {
    --bg: #f3f2f7;
    --panel: #ffffff;
    --fg: #1d1a2b;
    --muted: #6b6780;
    --line: #dddae6;
    --accent: #5b2fd6;
    --warn: #c2410c;
    --font-body: 'IBM Plex Sans KR', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    /* 제품 토큰(측정 대상) */
    --space-start: #4721ca;
    --space-end: #17034e;
    --page-bg: #f2f2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14121c; --panel: #1d1a28; --fg: #ece9f6; --muted: #a39fb8; --line: #2f2b3d; --accent: #a78bfa; --warn: #fb923c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #14121c; --panel: #1d1a28; --fg: #ece9f6; --muted: #a39fb8; --line: #2f2b3d; --accent: #a78bfa; --warn: #fb923c; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); max-width: 70ch; }

  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 20px; }
  .control { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .control label, .control .label { font-size: 12px; letter-spacing: .04em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .control output { font-family: var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .control label.toggle { display: flex; justify-content: flex-start; align-items: center; gap: 8px; font-size: 14px; letter-spacing: 0; color: var(--fg); }

  .stage { overflow-x: auto; }
  .phones { display: flex; gap: 20px; align-items: flex-start; width: max-content; }
  .phone-col { display: flex; flex-direction: column; gap: 8px; }
  .phone-col h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .phone-col p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 34ch; }
  .phone-col .metrics { font-family: var(--font-mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .metrics .bad { color: var(--warn); }
  .scaler { position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); }

  /* 휴대폰 화면 안쪽(제품 재현) */
  .screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--page-bg); }
  .screen .wrapper { position: absolute; inset: 0; }
  .screen .hero { position: absolute; left: 0; overflow: hidden; }
  .screen .page { position: absolute; left: 0; right: 0; bottom: 0; background: var(--page-bg); }
  .screen .canvas { position: absolute; left: 0; right: 0; }
  .screen .art { position: absolute; }
  .screen .art img { width: 100%; height: 100%; display: block; }
  .screen .card { position: absolute; left: 16px; right: 16px; height: 120px; background: #fff; border-radius: 12px; }
  .screen .fade { position: absolute; left: 0; right: 0; height: 62px; background: linear-gradient(to bottom, transparent, var(--page-bg)); }
  .screen .status { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font: 600 15px/1 -apple-system, system-ui, sans-serif; color: #fff; pointer-events: none; }
  .screen .status-outline { position: absolute; left: 0; right: 0; top: 0; border-bottom: 1px dashed rgba(255,255,255,.55); pointer-events: none; }
  .screen.boost { filter: contrast(4) saturate(.6); }

  .note { font-size: 13px; color: var(--muted); max-width: 80ch; margin: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <h1>히어로 상단 이음새 비교</h1>
    <p class="lead">메인 좁은 화면 히어로를 실제 그라데이션 · 장식 이미지 · 배치 규칙 그대로 다시 그렸습니다. 화면 폭, 상태 표시줄 높이, 당긴 거리를 바꿔 가며 세 방식의 위쪽 경계를 같이 봅니다.</p>
  </header>

  <section class="controls" aria-label="조건">
    <div class="control">
      <label for="width">화면 폭 <output id="width-out"></output></label>
      <input id="width" type="range" min="320" max="767" step="1" value="390">
      <div class="chips" data-for="width">
        <button type="button" data-value="360">360</button>
        <button type="button" data-value="390">390</button>
        <button type="button" data-value="430">430</button>
        <button type="button" data-value="600">600</button>
        <button type="button" data-value="767">767</button>
      </div>
    </div>
    <div class="control">
      <label for="status">상태 표시줄 <output id="status-out"></output></label>
      <input id="status" type="range" min="0" max="62" step="1" value="47">
      <div class="chips" data-for="status">
        <button type="button" data-value="0">웹 0</button>
        <button type="button" data-value="24">안드로이드 24</button>
        <button type="button" data-value="47">아이폰 47</button>
        <button type="button" data-value="59">아이폰 Pro 59</button>
      </div>
    </div>
    <div class="control">
      <label for="pull">당긴 거리 <output id="pull-out"></output></label>
      <input id="pull" type="range" min="0" max="140" step="1" value="0">
      <div class="chips" data-for="pull">
        <button type="button" data-value="0">안 당김</button>
        <button type="button" data-value="80">80</button>
        <button type="button" data-value="120">120</button>
      </div>
    </div>
    <div class="control">
      <span class="label">보기</span>
      <label class="toggle"><input id="deco" type="checkbox" checked> 장식 이미지</label>
      <label class="toggle"><input id="boost" type="checkbox"> 대비 4배 (이음새 강조)</label>
      <label class="toggle"><input id="guide" type="checkbox" checked> 상태 표시줄 경계 점선</label>
    </div>
  </section>

  <div class="stage">
    <div class="phones" id="phones"></div>
  </div>

  <p class="note">수치는 이 페이지에서 계산한 배치값입니다. 「그림 위쪽 빈틈」이 0보다 크면 그만큼 히어로 맨 위를 그림이 못 덮고, 그 자리에 크기가 다른 상자의 그라데이션이 보여 선이 생깁니다. 「그림 크기」는 시안 크기(475×304) 대비 배율입니다.</p>
</div>

      desc: '그림을 히어로 오른쪽 아래에 붙인다. 상태 표시줄만큼 히어로가 길어지면 맨 위가 비고, 히어로 상자 기준 그라데이션이 드러난다.',
      layout(W, S) {
        const w = Math.max(W, ART_W), h = w * ART_H / ART_W, H = HERO_H + S;
        return { heroBg: null, canvasTop: 0, canvasH: H, art: { w, h, top: H - h } };
      },
    },
    {
      id: 'a', title: 'A. 스테이징한 수정',
      desc: '그림은 상태 표시줄 아래 영역 기준으로 시안 구도를 지킨다. 그림이 못 덮는 맨 위는 그림 윗줄 색을 늘인 바탕으로 채운다.',
      layout(W, S) {
        const w = Math.max(W, ART_W), h = w * ART_H / ART_W;
        return { heroBg: TOP_ROW, canvasTop: S, canvasH: HERO_H, art: { w, h, top: HERO_H / 2 - 0.5625 * h } };
      },
    },
    {
      id: 'b', title: 'B. 히어로 높이까지 키우기',
      desc: '그림을 상태 표시줄 포함 히어로 높이 전체를 덮도록 키운다. 기준선은 A와 같은 비율로 두되 위아래가 비지 않게 막는다.',
      layout(W, S) {
        const H = HERO_H + S;
        const w = Math.max(W, ART_W, H * ART_W / ART_H), h = w * ART_H / ART_W;
        const top = Math.min(0, Math.max(H - h, H / 2 - 0.5625 * h));
        return { heroBg: null, canvasTop: 0, canvasH: H, art: { w, h, top } };
      },
    },
  ];

  const $ = (id) => document.getElementById(id);
  const phones = $('phones');
  const cols = VARIANTS.map((v) => {
    const col = document.createElement('div');
    col.className = 'phone-col';
    col.innerHTML = `<h2>${v.title}</h2><p>${v.desc}</p><div class="metrics"></div><div class="scaler"><div class="screen"><div class="wrapper"></div><div class="page"></div><div class="hero"><div class="canvas"><div class="art"><img alt=""></div></div><div class="fade"></div></div><div class="card"></div><div class="status-outline"></div><div class="status"><span>8:41</span><span>●●● 36</span></div></div></div>`;
    col.querySelector('img').src = DECO;
    phones.appendChild(col);
    return { v, col };
  });

  function render() {
    const W = +$('width').value, S = +$('status').value, P = +$('pull').value;
    $('width-out').textContent = `${W}px`;
    $('status-out').textContent = `${S}px`;
    $('pull-out').textContent = `${P}px`;
    document.querySelectorAll('.chips').forEach((group) => {
      const value = $(group.dataset.for).value;
      group.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === value)));
    });
    const stageW = document.querySelector('.stage').clientWidth;
    const colW = Math.max(240, Math.min(380, (stageW - 40) / 3));
    const scale = colW / W;

    for (const { v, col } of cols) {
      const L = v.layout(W, S);
      const H = HERO_H + S;
      const screen = col.querySelector('.screen');
      const scaler = col.querySelector('.scaler');
      scaler.style.width = `${colW}px`;
      scaler.style.height = `${VIEW_H * scale}px`;
      Object.assign(screen.style, { width: `${W}px`, height: `${VIEW_H}px`, transform: `scale(${scale})` });
      screen.classList.toggle('boost', $('boost').checked);

      screen.querySelector('.wrapper').style.background = TOP_ROW;
      const hero = screen.querySelector('.hero');
      Object.assign(hero.style, { top: `${P}px`, width: `${W}px`, height: `${H}px`, background: L.heroBg ?? 'transparent' });
      const canvas = screen.querySelector('.canvas');
      Object.assign(canvas.style, { top: `${L.canvasTop}px`, height: `${L.canvasH}px`, background: NARROW_GRADIENT });
      const art = screen.querySelector('.art');
      Object.assign(art.style, { width: `${L.art.w}px`, height: `${L.art.h}px`, right: '0px', top: `${L.art.top}px`, background: NARROW_GRADIENT });
      art.querySelector('img').style.visibility = $('deco').checked ? 'visible' : 'hidden';
      screen.querySelector('.page').style.top = `${P + H}px`;
      screen.querySelector('.fade').style.top = `${H - 62}px`;
      screen.querySelector('.card').style.top = `${P + H - 38}px`;
      const status = screen.querySelector('.status');
      status.style.height = `${S}px`;
      status.style.display = S > 0 ? 'flex' : 'none';
      const outline = screen.querySelector('.status-outline');
      outline.style.height = `${S}px`;
      outline.style.display = $('guide').checked && S > 0 ? 'block' : 'none';

      // 그림이 히어로 맨 위를 못 덮는 높이(히어로 기준).
      const artTopInHero = L.canvasTop + L.art.top;
      const gap = Math.max(0, artTopInHero);
      const coveredByBg = L.heroBg ? Math.min(gap, L.canvasTop) : 0;
      const exposed = gap - coveredByBg > 0.5 && !L.heroBg;
      const ratio = (L.art.w / ART_W).toFixed(3);
      col.querySelector('.metrics').innerHTML =
        `그림 위쪽 빈틈 <span class="${exposed ? 'bad' : ''}">${gap.toFixed(1)}px${exposed ? ' · 선 생김' : L.heroBg && gap > 0 ? ' · 같은 색 바탕으로 채움' : ''}</span><br>` +
        `그림 크기 ×${ratio} · 그림 위치 ${artTopInHero.toFixed(1)}px`;
    }
  }

  ['width', 'status', 'pull', 'deco', 'boost', 'guide'].forEach((id) => $(id).addEventListener('input', render));
  document.querySelectorAll('.chips').forEach((group) => group.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $(group.dataset.for).value = b.dataset.value; render();
  }));
  window.addEventListener('resize', render);
  render();
</script>
